services:
  db:
    image: postgres:17-alpine
    container_name: passmanagerweb_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: passmanagerweb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
