{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Confirm Master Password{% endblock title %}

{% block content %}
    <form method='POST' id="reauth-form">
        {% csrf_token %}
        {{ form|crispy }}
        <button name="submit" class="btn btn-primary w-100">Confirm and Export</button>
    </form>

    <script>
        // redirect after download trigger
        document.getElementById("reauth-form").addEventListener("submit", () => {
            setTimeout(() => {
                window.location.href = "{% url 'users:account' %}";
            }, 1000);
        });
    </script>
{% endblock content %}
